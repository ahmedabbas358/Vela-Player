name: Vela CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Fuzz & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment Tooling
        run: |
          flutter --version
          dart --version
          python --version

      - name: Install Project & Monorepo Dependencies
        run: |
          flutter pub get
          for dir in packages/*/; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "Resolving dependencies for $dir..."
              (cd "$dir" && flutter pub get)
            fi
          done

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -e .
          pip install pytest httpx

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Subtitle Core Unit & Fuzz Tests
        run: |
          cd packages/subtitle_core
          dart test

      - name: Run Player Engine Package Tests
        run: |
          cd packages/player
          flutter test

      - name: Run AI Intelligence Package Tests
        run: |
          cd packages/ai
          flutter test

      - name: Run Root Unit & Widget Tests
        run: flutter test

      - name: Run Backend Entitlement & API Tests
        run: |
          cd backend
          pytest

      - name: Build Android Release Bundle Validation (Dry Run)
        run: flutter build appbundle --release --no-pub

      - name: Upload Test Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

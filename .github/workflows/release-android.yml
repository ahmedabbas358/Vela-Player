name: Release Android (Google Play)

on:
  workflow_dispatch:
    inputs:
      deploy_track:
        description: 'Google Play track to deploy (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - 'v*'

jobs:
  build-and-release-android:
    name: Build & Publish Android AAB
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Tests
        run: flutter test

      - name: Configure Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=upload-keystore.jks
          EOF
          else
            echo "Release keystore secret not set. Skipping production signing setup."
          fi

      - name: Build Android App Bundle (AAB - API 36 Compliant)
        run: flutter build appbundle --release

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-android-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish to Google Play (Conditional)
        if: env.PLAY_SERVICE_ACCOUNT != ''
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Deploying to Google Play track: ${{ github.event.inputs.deploy_track || 'internal' }}"
          # Deploy step uses fastlane or google-play-action when credentials are provided

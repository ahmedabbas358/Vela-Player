name: Release iOS (App Store Connect)

on:
  workflow_dispatch:
    inputs:
      distribute_testflight:
        description: 'Publish automatically to TestFlight'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  build-and-release-ios:
    name: Build & Archive iOS IPA
    runs-on: macos-14
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Archive (No Codesign for Validation or Signed with Secrets)
        run: flutter build ipa --release --no-codesign

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vela-ios-release-archive
          path: build/ios/archive/*.xcarchive
          retention-days: 30
